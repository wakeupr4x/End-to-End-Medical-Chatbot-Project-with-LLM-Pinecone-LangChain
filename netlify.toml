[build]
  publish = "public"

# Optional: If you deploy the backend on Render/Railway, you can proxy /api calls directly through Netlify:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-medibot-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
